<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Gramática — Português Brasileiro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topo">
    <div class="container topo-conteudo">
      <div>
        <h1>Banco de Gramática</h1>
        <p>Português brasileiro — 500 perguntas, do A1 ao C2</p>
      </div>

      <div class="progresso">
        <span id="progresso-texto">0 de 500 perguntas estudadas</span>

        <div class="barra">
          <div id="progresso-barra"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="controles">
      <input
        id="busca"
        type="search"
        placeholder="Buscar pergunta, tema, regra ou explicação... Ex: pretérito, artigos, subjuntivo"
        autocomplete="off"
      >

      <div class="filtros">
        <button class="filtro ativo" data-nivel="todos">Todos</button>
        <button class="filtro" data-nivel="A1">A1</button>
        <button class="filtro" data-nivel="A2">A2</button>
        <button class="filtro" data-nivel="B1">B1</button>
        <button class="filtro" data-nivel="B2">B2</button>
        <button class="filtro" data-nivel="C1">C1</button>
        <button class="filtro" data-nivel="C2">C2</button>
      </div>
    </section>

    <section id="lista-temas" class="lista-temas"></section>

    <p id="sem-resultados" class="sem-resultados oculto">
      Nenhuma pergunta encontrada. Tente outra busca ou outro nível.
    </p>

  </main>

  <footer class="rodape">
    <p>
      Curso de português brasileiro • Banco de gramática • Seu progresso fica salvo neste navegador.
    </p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
